<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Paul and his four in-game commands">
<style>
.cmd{font:600 19px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#F5B93A}
.say{font:400 19px 'Avenir Next','Segoe UI',Helvetica,Arial,sans-serif;fill:#D3D9EA}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 6s steps(1,end) infinite}
@keyframes blink{0%,93%{transform:scaleY(1)}94%,97%{transform:scaleY(.15)}98%,100%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.eye{animation:none}}
</style>
<rect width="1200" height="220" fill="#2A3562"/>
<g fill="#8E97B8"><rect x="34" y="28" width="5" height="5"/><rect x="226" y="52" width="4" height="4"/><rect x="1162" y="24" width="5" height="5"/><rect x="1172" y="118" width="4" height="4"/></g>
<rect x="0" y="180" width="1200" height="40" fill="#4E7A40"/>
<rect x="0" y="180" width="1200" height="10" fill="#6FA05A"/>
<g transform="translate(52 39.2) scale(.22)">
<rect x="380" y="150" width="40" height="80" fill="#6C7594"/>
<rect x="360" y="110" width="80" height="60" fill="#F5B93A"/>
<rect x="360" y="110" width="80" height="20" fill="#FFD778"/>
<rect x="150" y="320" width="60" height="140" fill="#6C7594"/>
<rect x="590" y="320" width="60" height="140" fill="#565E7C"/>
<rect x="200" y="220" width="400" height="360" fill="#AEB6D0"/>
<rect x="200" y="220" width="400" height="40" fill="#D3D9EA"/>
<rect x="540" y="260" width="60" height="320" fill="#8B93B0"/>
<rect x="260" y="330" width="80" height="80" fill="#151C3B"/>
<rect x="440" y="330" width="80" height="80" fill="#151C3B"/>
<rect class="eye" x="280" y="350" width="40" height="40" fill="#F5B93A"/>
<rect class="eye" x="460" y="350" width="40" height="40" fill="#F5B93A"/>
<rect x="290" y="480" width="220" height="40" fill="#151C3B"/>
<g fill="#AEB6D0"><rect x="330" y="480" width="20" height="40"/><rect x="390" y="480" width="20" height="40"/><rect x="450" y="480" width="20" height="40"/></g>
<rect x="260" y="580" width="280" height="60" fill="#6C7594"/>
</g>
<rect x="268" y="26" width="872" height="136" fill="#151C3B" opacity=".6"/>
<rect x="268" y="26" width="6" height="136" fill="#F5B93A"/>
<text class="cmd" x="298" y="58">.paul an</text><text class="say" x="470" y="58">Paul joins the world you are playing in.</text>
<text class="cmd" x="298" y="90">.paul aus</text><text class="say" x="470" y="90">He leaves again.</text>
<text class="cmd" x="298" y="122">.paul stil</text><text class="say" x="470" y="122">Switches the way he talks.</text>
<text class="cmd" x="298" y="154">.paul status</text><text class="say" x="470" y="154">Tells you whether he is on.</text>
</svg>
