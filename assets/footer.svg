<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 56" width="1200" height="56" role="img" aria-label="">
  <defs>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c9fb8" stop-opacity="0"/><stop offset="0.5" stop-color="#5ee7df"/><stop offset="1" stop-color="#2c9fb8" stop-opacity="0"/>
    </linearGradient>
    <style>
      .p{animation:run 6s cubic-bezier(.45,0,.55,1) infinite}
      @keyframes run{0%{transform:translateX(-160px);opacity:0}15%,85%{opacity:1}100%{transform:translateX(1200px);opacity:0}}
      @media (prefers-reduced-motion:reduce){.p{display:none}}
    </style>
  </defs>
  <rect x="0" y="27" width="1200" height="2" fill="url(#ln)" opacity="0.55"/>
  <rect class="p" x="0" y="26" width="160" height="4" rx="2" fill="url(#ln)"/>
</svg>
